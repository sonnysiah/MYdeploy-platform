name: Deploy MYdeploy Platform

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (defaults to git SHA)'
        required: false

permissions:
  id-token: write
  contents: read

env:
  IMAGE_TAG: ${{ github.event.inputs.image_tag || format('sha-{0}', github.sha) }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and push image
        working-directory: platform
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/mydeploy-platform:${{ env.IMAGE_TAG }} .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/mydeploy-platform:${{ env.IMAGE_TAG }}

      - name: Run database migrations
        working-directory: platform
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Deploy Bicep infrastructure
        env:
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          IMAGE_TAG:               ${{ env.IMAGE_TAG }}
        run: |
          az deployment sub create \
            --location southeastasia \
            --template-file platform/infrastructure/main.bicep \
            --parameters platform/infrastructure/parameters/prod.bicepparam

      - name: Health check
        run: |
          FQDN=$(az deployment sub show \
            --name main \
            --query properties.outputs.appFqdn.value -o tsv)
          echo "Checking https://${FQDN}/"
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${FQDN}/login")
            echo "Attempt $i: HTTP $STATUS"
            [ "$STATUS" = "200" ] && exit 0
            sleep 10
          done
          echo "Health check failed" && exit 1
